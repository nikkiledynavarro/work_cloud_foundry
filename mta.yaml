_schema-version: "3.2"
ID: shiperp-fiori-cf-migration
version: 0.0.1
description: ShipERP Fiori HTML5 apps migrated from Neo to Cloud Foundry HTML5 Apps Repository.

modules:
  - name: cancelshipmentecc
    type: html5
    path: apps/cancelshipmentecc
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
        - npm run package
      build-result: dist
      supported-platforms: []

  - name: cancelshipmentecc-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: cancelshipmentecc-app-front-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/cancelshipmentecc
      requires:
        - name: cancelshipmentecc
          artifacts:
            - cancelshipmentecc.zip
          target-path: resources/cancelshipmentecc/

  - name: cancelshipmentecc-destination-content
    type: com.sap.application.content
    requires:
      - name: cancelshipmentecc-destination-service
        parameters:
          content-target: true
      - name: cancelshipmentecc-app-front-service
        parameters:
          service-key:
            name: cancelshipmentecc-app-front-service-key
      - name: cancelshipmentecc-xsuaa-service
        parameters:
          service-key:
            name: cancelshipmentecc-xsuaa-service-key
    parameters:
      content:
        instance:
          destinations:
            - Name: cancelshipmentecc-app-front-service
              ServiceInstanceName: cancelshipmentecc-app-front-service
              ServiceKeyName: cancelshipmentecc-app-front-service-key
              sap.cloud.service: comerpisshiperpcancelshipmentecc
            - Name: cancelshipmentecc-xsuaa-service
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cancelshipmentecc-xsuaa-service
              ServiceKeyName: cancelshipmentecc-xsuaa-service-key
              sap.cloud.service: comerpisshiperpcancelshipmentecc
          existing_destinations_policy: update
    build-parameters:
      no-source: true

