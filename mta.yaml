_schema-version: "3.2"
ID: shiperp-fiori-cf-migration
version: 0.0.1
description: ShipERP Fiori HTML5 apps migrated from Neo to Cloud Foundry HTML5 Apps Repository.

modules:
  - name: cancelhr7
    type: html5
    path: apps/cancelhr7
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
        - npm run package
      build-result: dist
      supported-platforms: []

  - name: cancelhr7-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: cancelhr7-app-front-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/cancelhr7
      requires:
        - name: cancelhr7
          artifacts:
            - cancelhr7.zip
          target-path: resources/cancelhr7/

  - name: cancelhr7-destination-content
    type: com.sap.application.content
    requires:
      - name: cancelhr7-destination-service
        parameters:
          content-target: true
      - name: cancelhr7-app-front-service
        parameters:
          service-key:
            name: cancelhr7-app-front-service-key
      - name: cancelhr7-xsuaa-service
        parameters:
          service-key:
            name: cancelhr7-xsuaa-service-key
    parameters:
      content:
        instance:
          destinations:
            - Name: cancelhr7-app-front-service
              ServiceInstanceName: cancelhr7-app-front-service
              ServiceKeyName: cancelhr7-app-front-service-key
              sap.cloud.service: comerpisshiperpcancelhr7
            - Name: cancelhr7-xsuaa-service
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cancelhr7-xsuaa-service
              ServiceKeyName: cancelhr7-xsuaa-service-key
              sap.cloud.service: comerpisshiperpcancelhr7
          existing_destinations_policy: update
    build-parameters:
      no-source: true
