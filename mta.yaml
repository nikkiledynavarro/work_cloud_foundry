  - name: acesubmitfiling-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: acesubmitfiling-app-front-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/acesubmitfiling
      requires:
        - name: acesubmitfiling
          artifacts:
            - acesubmitfiling.zip
          target-path: resources/acesubmitfiling/

  - name: acesubmitfiling-destination-content
    type: com.sap.application.content
    requires:
      - name: acesubmitfiling-destination-service
        parameters:
          content-target: true
      - name: acesubmitfiling-app-front-service
        parameters:
          service-key:
            name: acesubmitfiling-app-front-service-key
      - name: acesubmitfiling-xsuaa-service
        parameters:
          service-key:
            name: acesubmitfiling-xsuaa-service-key
    parameters:
      content:
        instance:
          destinations:
            - Name: acesubmitfiling-app-front-service
              ServiceInstanceName: acesubmitfiling-app-front-service
              ServiceKeyName: acesubmitfiling-app-front-service-key
              sap.cloud.service: comerpisshiperpacesubmitfiling
            - Name: acesubmitfiling-xsuaa-service
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: acesubmitfiling-xsuaa-service
              ServiceKeyName: acesubmitfiling-xsuaa-service-key
              sap.cloud.service: comerpisshiperpacesubmitfiling
          existing_destinations_policy: update
    build-parameters:
      no-source: true

