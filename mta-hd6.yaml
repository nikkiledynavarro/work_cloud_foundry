_schema-version: "3.2"
ID: shiperp-fiori-hd6
version: 0.0.1
description: Migrated ShipERP Neo HTML5 applications connected to HD6.

modules:
  - name: cancelhd6
    type: html5
    path: apps/cancelhd6
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
        - npm run package
      build-result: dist
      supported-platforms: []

  - name: disputehd6
    type: html5
    path: apps/disputehd6
    build-parameters:
      builder: custom
