      service-plan: app-host

  - name: cancelhd6-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true

  - name: cancelhd6-xsuaa-service
