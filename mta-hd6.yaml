      builder: custom
      commands:
        - npm install
        - npm run build
        - npm run package
      build-result: dist
      supported-platforms: []

  - name: cancelhd6-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: cancelhd6-app-front-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/cancelhd6
      requires:
        - name: cancelhd6
          artifacts:
            - cancelhd6.zip
          target-path: resources/cancelhd6/

  - name: cancelhd6-destination-content
    type: com.sap.application.content
    requires:
      - name: cancelhd6-destination-service
        parameters:
          content-target: true
      - name: cancelhd6-app-front-service
        parameters:
          service-key:
            name: cancelhd6-app-front-service-key
      - name: cancelhd6-xsuaa-service
        parameters:
          service-key:
            name: cancelhd6-xsuaa-service-key
    parameters:
      content:
        instance:
          destinations:
            - Name: cancelhd6-app-front-service
              ServiceInstanceName: cancelhd6-app-front-service
              ServiceKeyName: cancelhd6-app-front-service-key
              sap.cloud.service: comerpisshiperpcancelhd6
            - Name: cancelhd6-xsuaa-service
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cancelhd6-xsuaa-service
              ServiceKeyName: cancelhd6-xsuaa-service-key
              sap.cloud.service: comerpisshiperpcancelhd6
          existing_destinations_policy: update
    build-parameters:
      no-source: true

