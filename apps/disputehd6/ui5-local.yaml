specVersion: "3.0"
metadata:
  name: dispute
type: application
framework:
  name: SAPUI5
  version: "1.125.1"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /sap
            url: http://10.10.1.76:8001
            client: "100"
            # Credentials read from env vars at runtime (see approuter/.env).
            # NEVER commit username/password here.
            credentials:
              username: env:UI5_BACKEND_USER
              password: env:UI5_BACKEND_PASS